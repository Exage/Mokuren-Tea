name: mokuren-tea-backend

services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    command: ['mongod', '--replSet', 'mokuren-rs', '--bind_ip_all', '--port', '27017']
    ports:
      - '127.0.0.1:27018:27017'
    volumes:
      - mongodb-replica-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --host
        - '127.0.0.1:27017'
        - --eval
        - >-
          try { rs.status(); }
          catch (error) {
            if (error.codeName !== 'NotYetInitialized') { throw error; }
            rs.initiate({ _id: 'mokuren-rs', members: [{ _id: 0, host: 'mongodb:27017' }] });
          }
          quit(db.hello().isWritablePrimary ? 0 : 1);
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  mongodb-replica-data:
